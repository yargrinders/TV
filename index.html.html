<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Fußball Live — ARD & ZDF</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --dark: #0a0a0f;
    --dark2: #111118;
    --dark3: #1a1a25;
    --card: #13131e;
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.15);
    --text: #f0f0f8;
    --muted: #888898;
    --ard-color: #1a6bc4;
    --ard-glow: rgba(26,107,196,0.3);
    --zdf-color: #e8002d;
    --zdf-glow: rgba(232,0,45,0.3);
    --accent: #3d9aff;
    --green: #22c55e;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,15,0.92);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .ball-icon {
    font-size: 1.4rem;
    animation: spin 8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #live-clock {
    font-size: 0.8rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.05em;
  }

  /* ── HERO ── */
  .hero {
    padding: 5rem 2rem 3rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(61,154,255,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(34,197,94,0.12);
    border: 1px solid rgba(34,197,94,0.25);
    color: var(--green);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 100px;
    margin-bottom: 1.5rem;
  }

  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  .hero h1 {
    font-size: clamp(2.4rem, 6vw, 4.5rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1.05;
    margin-bottom: 1rem;
    background: linear-gradient(135deg, #ffffff 0%, #aab4cc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-sub {
    color: var(--muted);
    font-size: 1.05rem;
    max-width: 480px;
    margin: 0 auto 2.5rem;
    line-height: 1.6;
  }

  .hero-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.2s ease;
    text-decoration: none;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: #5aaeff; transform: translateY(-1px); }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { border-color: var(--border-hover); color: var(--text); }

  /* ── CHANNELS GRID ── */
  .channels-section {
    padding: 1rem 2rem 4rem;
    max-width: 1100px;
    margin: 0 auto;
  }

  .section-label {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1.5rem;
  }

  .channels-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  @media (max-width: 680px) {
    .channels-grid { grid-template-columns: 1fr; }
    header { padding: 0 1rem; }
    .hero { padding: 3rem 1rem 2rem; }
    .channels-section { padding: 1rem 1rem 3rem; }
  }

  /* ── CHANNEL CARD ── */
  .channel-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    transition: border-color 0.25s, transform 0.25s;
    cursor: pointer;
  }
  .channel-card:hover { border-color: var(--border-hover); transform: translateY(-2px); }

  .channel-card.ard { --ch-color: var(--ard-color); --ch-glow: var(--ard-glow); }
  .channel-card.zdf { --ch-color: var(--zdf-color); --ch-glow: var(--zdf-glow); }

  .channel-card.active {
    border-color: var(--ch-color);
    box-shadow: 0 0 0 1px var(--ch-color), 0 8px 40px var(--ch-glow);
  }

  /* video container */
  .video-wrap {
    position: relative;
    aspect-ratio: 16/9;
    background: #08080f;
    overflow: hidden;
  }

  .video-wrap video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .video-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(0,0,0,0.55);
    transition: opacity 0.3s;
  }

  .video-overlay.hidden { opacity: 0; pointer-events: none; }

  .play-btn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--ch-color);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 0 24px var(--ch-glow);
  }
  .play-btn:hover { transform: scale(1.1); box-shadow: 0 0 36px var(--ch-glow); }

  .play-btn svg { width: 22px; height: 22px; fill: #fff; margin-left: 3px; }

  .overlay-label {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.7);
    font-weight: 500;
  }

  /* loading spinner */
  .loader {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.7);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .loader.show { opacity: 1; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: var(--ch-color);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  /* ── CHANNEL INFO BAR ── */
  .channel-info {
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .channel-identity {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .channel-logo {
    flex-shrink: 0;
  }

  /* ARD Logo SVG */
  .logo-ard { width: 52px; height: 52px; }
  /* ZDF Logo SVG */
  .logo-zdf { width: 52px; height: 36px; }

  .ch-name {
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .ch-desc {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 2px;
  }

  .ch-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  .badge-live {
    background: rgba(34,197,94,0.12);
    border: 1px solid rgba(34,197,94,0.25);
    color: var(--green);
  }

  .badge-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: currentColor;
    animation: pulse 1.5s infinite;
  }

  /* ── CONTROLS ── */
  .controls {
    padding: 0 20px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .ctrl-btn {
    background: var(--dark3);
    border: 1px solid var(--border);
    color: var(--muted);
    width: 36px;
    height: 36px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .ctrl-btn:hover { background: var(--border); color: var(--text); }
  .ctrl-btn svg { width: 16px; height: 16px; fill: currentColor; }

  .volume-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 80px;
    height: 4px;
    background: var(--dark3);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--ch-color);
    cursor: pointer;
  }

  .ctrl-spacer { flex: 1; }

  .fullscreen-btn {
    margin-left: auto;
  }

  /* ── INFO SECTION ── */
  .info-section {
    padding: 2rem 2rem 4rem;
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
  }

  .info-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
  }

  .info-icon {
    font-size: 1.5rem;
    margin-bottom: 10px;
  }

  .info-title {
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .info-text {
    font-size: 0.78rem;
    color: var(--muted);
    line-height: 1.5;
  }

  /* ── FOOTER ── */
  footer {
    border-top: 1px solid var(--border);
    padding: 2rem;
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
  }

  footer a { color: inherit; text-decoration: underline; opacity: 0.7; }
</style>
</head>

<footer>
  Nur für privaten Gebrauch &nbsp;·&nbsp; Streams via <a href="https://www.daserste.de" target="_blank">ARD</a> &amp; <a href="https://www.zdf.de" target="_blank">ZDF</a>

<script>
const STREAMS = {
  ard: 'https://daserste-live.ard-mcdn.de/daserste/live/hls/de/master.m3u8',
  zdf: 'http://zdf-hls-15.akamaized.net/hls/live/2016498/de/veryhigh/master.m3u8'
};

const hls = {};
const state = { ard: 'idle', zdf: 'idle' };

function startStream(ch) {
  const vid = document.getElementById('vid-' + ch);
  const overlay = document.getElementById('overlay-' + ch);
  const loader = document.getElementById('loader-' + ch);
  const card = document.getElementById('card-' + ch);

  overlay.classList.add('hidden');
  loader.classList.add('show');
  card.classList.add('active');

  if (Hls.isSupported()) {
    if (hls[ch]) { hls[ch].destroy(); }
    hls[ch] = new Hls({ enableWorker: true, lowLatencyMode: false });
    hls[ch].loadSource(STREAMS[ch]);
    hls[ch].attachMedia(vid);
    hls[ch].on(Hls.Events.MANIFEST_PARSED, () => {
      vid.play().catch(() => {});
      loader.classList.remove('show');
      state[ch] = 'playing';
      updatePlayBtn(ch);
    });
    hls[ch].on(Hls.Events.ERROR, (e, data) => {
      if (data.fatal) {
        loader.classList.remove('show');
        overlay.classList.remove('hidden');
        overlay.querySelector('.overlay-label').textContent = '⚠ Verbindungsfehler — erneut versuchen';
        card.classList.remove('active');
      }
    });
  } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
    vid.src = STREAMS[ch];
    vid.play().catch(() => {});
    loader.classList.remove('show');
    state[ch] = 'playing';
    updatePlayBtn(ch);
  } else {
    loader.classList.remove('show');
    overlay.classList.remove('hidden');
    overlay.querySelector('.overlay-label').textContent = 'HLS nicht unterstützt';
  }
}

function togglePlay(ch) {
  const vid = document.getElementById('vid-' + ch);
  if (state[ch] === 'idle') { startStream(ch); return; }
  if (vid.paused) {
    vid.play();
    state[ch] = 'playing';
  } else {
    vid.pause();
    state[ch] = 'paused';
  }
  updatePlayBtn(ch);
}

function updatePlayBtn(ch) {
  const btn = document.getElementById('playpause-' + ch);
  const vid = document.getElementById('vid-' + ch);
  const isPlaying = state[ch] === 'playing' && !vid.paused;
  btn.innerHTML = isPlaying
    ? '<svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>'
    : '<svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor"><path d="M8 5v14l11-7z"/></svg>';
}

function toggleMute(ch) {
  const vid = document.getElementById('vid-' + ch);
  vid.muted = !vid.muted;
}

function setVolume(ch, val) {
  const vid = document.getElementById('vid-' + ch);
  vid.volume = parseFloat(val);
  vid.muted = (parseFloat(val) === 0);
}

function goFullscreen(ch) {
  const wrap = document.getElementById('wrap-' + ch);
  if (wrap.requestFullscreen) wrap.requestFullscreen();
  else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
}

function startAll() {
  startStream('ard');
  setTimeout(() => startStream('zdf'), 600);
}

// Keyboard: press F for fullscreen on active card, Space pause/play
document.addEventListener('keydown', e => {
  if (e.key === ' ' && e.target === document.body) {
    e.preventDefault();
    const active = document.querySelector('.channel-card.active');
    if (active) {
      const ch = active.id.replace('card-', '');
      togglePlay(ch);
    }
  }
});

// Clock
function tick() {
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const days = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  document.getElementById('live-clock').textContent =
    `${days[now.getDay()]} ${pad(now.getDate())}.${pad(now.getMonth()+1)} · ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
