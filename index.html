<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Fußball Live — ARD & ZDF</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --dark: #0a0a0f; --dark2: #111118; --dark3: #1a1a25; --card: #13131e;
    --border: rgba(255,255,255,0.07); --border-hover: rgba(255,255,255,0.15);
    --text: #f0f0f8; --muted: #888898;
    --ard-color: #1a6bc4; --ard-glow: rgba(26,107,196,0.3);
    --zdf-color: #e8002d; --zdf-glow: rgba(232,0,45,0.3);
    --accent: #3d9aff; --green: #22c55e;
  }
  html { scroll-behavior: smooth; }
  body { background: var(--dark); color: var(--text); font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; overflow-x: hidden; }
  header { position: sticky; top: 0; z-index: 100; background: rgba(10,10,15,0.92); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 0 2rem; height: 64px; display: flex; align-items: center; justify-content: space-between; }
  .header-brand { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; font-weight: 700; letter-spacing: -0.02em; }
  .ball-icon { font-size: 1.4rem; animation: spin 8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #live-clock { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0.05em; }
  .hero { padding: 5rem 2rem 3rem; text-align: center; position: relative; overflow: hidden; }
  .hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(61,154,255,0.08) 0%, transparent 70%); pointer-events: none; }
  .hero-eyebrow { display: inline-flex; align-items: center; gap: 6px; background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.25); color: var(--green); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; padding: 5px 14px; border-radius: 100px; margin-bottom: 1.5rem; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }
  .hero-sub { color: var(--muted); font-size: 1.05rem; max-width: 480px; margin: 0 auto 2.5rem; line-height: 1.6; }
  .hero-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 10px; font-size: 0.92rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s ease; text-decoration: none; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #5aaeff; transform: translateY(-1px); }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--border-hover); color: var(--text); }
  .channels-section { padding: 1rem 2rem 4rem; max-width: 1100px; margin: 0 auto; }
  .section-label { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 1.5rem; }
  .channels-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 680px) { .channels-grid { grid-template-columns: 1fr; } header { padding: 0 1rem; } .hero { padding: 3rem 1rem 2rem; } .channels-section { padding: 1rem 1rem 3rem; } }
  .channel-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; transition: border-color 0.25s, transform 0.25s; cursor: pointer; }
  .channel-card:hover { border-color: var(--border-hover); transform: translateY(-2px); }
  .channel-card.ard { --ch-color: var(--ard-color); --ch-glow: var(--ard-glow); }
  .channel-card.zdf { --ch-color: var(--zdf-color); --ch-glow: var(--zdf-glow); }
  .channel-card.active { border-color: var(--ch-color); box-shadow: 0 0 0 1px var(--ch-color), 0 8px 40px var(--ch-glow); }
  .video-wrap { position: relative; aspect-ratio: 16/9; background: #08080f; overflow: hidden; }
  .video-wrap video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .video-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(0,0,0,0.55); transition: opacity 0.3s; }
  .video-overlay.hidden { opacity: 0; pointer-events: none; }
  .play-btn { width: 60px; height: 60px; border-radius: 50%; background: var(--ch-color); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 0 24px var(--ch-glow); }
  .play-btn:hover { transform: scale(1.1); box-shadow: 0 0 36px var(--ch-glow); }
  .play-btn svg { width: 22px; height: 22px; fill: #fff; margin-left: 3px; }
  .overlay-label { font-size: 0.8rem; color: rgba(255,255,255,0.7); font-weight: 500; }
  .loader { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .loader.show { opacity: 1; }
  .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--ch-color); border-radius: 50%; animation: spin 0.8s linear infinite; }
  .channel-info { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .channel-identity { display: flex; align-items: center; gap: 14px; }
  .channel-logo { flex-shrink: 0; }
  .logo-ard { width: 52px; height: 52px; }
  .logo-zdf { width: 52px; height: 36px; }
  .ch-name { font-size: 1rem; font-weight: 700; letter-spacing: -0.02em; }
  .ch-desc { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .ch-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; flex-shrink: 0; }
  .badge-live { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.25); color: var(--green); }
  .badge-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: pulse 1.5s infinite; }
  .controls { padding: 0 20px 12px; display: flex; align-items: center; gap: 10px; }
  .ctrl-btn { background: var(--dark3); border: 1px solid var(--border); color: var(--muted); width: 36px; height: 36px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0; }
  .ctrl-btn:hover { background: var(--border); color: var(--text); }
  .ctrl-btn svg { width: 16px; height: 16px; fill: currentColor; }
  .volume-slider { -webkit-appearance: none; appearance: none; width: 80px; height: 4px; background: var(--dark3); border-radius: 2px; outline: none; cursor: pointer; }
  .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--ch-color); cursor: pointer; }
  .ctrl-spacer { flex: 1; }
  .fullscreen-btn { margin-left: auto; }
  .stream-links { padding: 10px 16px 14px; display: flex; flex-wrap: wrap; gap: 8px; border-top: 1px solid var(--border); }
  .stream-link { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; text-decoration: none; border: 1px solid var(--border); color: var(--muted); background: var(--dark3); transition: all 0.15s; letter-spacing: 0.02em; font-family: inherit; cursor: pointer; }
  .stream-link:hover { border-color: var(--ch-color); color: var(--text); background: rgba(255,255,255,0.05); }
  .stream-link svg { width: 13px; height: 13px; fill: currentColor; flex-shrink: 0; }
  .link-label { font-size: 0.65rem; color: var(--muted); opacity: 0.6; align-self: center; white-space: nowrap; padding: 0 2px; }

  /* PS4 info banner */
  .ps4-banner { display: none; margin: 0 16px 12px; padding: 10px 14px; background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.2); border-radius: 10px; font-size: 0.75rem; color: #f59e0b; line-height: 1.5; }
  .ps4-banner b { font-weight: 700; }

  footer { border-top: 1px solid var(--border); padding: 2rem; text-align: center; color: var(--muted); font-size: 0.78rem; }
  footer a { color: inherit; text-decoration: underline; opacity: 0.7; }
</style>

<script>
// ── Device detection ────────────────────────────────────────────────────────
const ua = navigator.userAgent || '';
const isPS4 = /PlayStation 4/i.test(ua);
const isIOS = /iPhone|iPad|iPod/i.test(ua);

// ── Stream URLs ─────────────────────────────────────────────────────────────
// PS4: не один URL, а список запасных потоков.
// Старый PS4 WebKit часто виснет на master-плейлистах с отдельной audio дорожкой,
// поэтому при зависании код сам переключает следующий вариант.
const STREAM_CANDIDATES = {
  ard: isPS4 ? [
    // 1) Akamai fallback Das Erste — чаще стабильнее на старых устройствах
    'https://derste247livede.akamaized.net/hls/live/658317/daserste_de/master.m3u8',

    // 2) Старый ARD mcdn — иногда лучше дружит со старыми HLS-плеерами
    'https://mcdn.daserste.de/daserste/de/master.m3u8',

    // 3) Новый официальный ARD master
    'https://daserste-live.ard-mcdn.de/daserste/live/hls/de/master.m3u8',

    // 4) Новый low, если существует на CDN
    'https://daserste-live.ard-mcdn.de/daserste/live/hls/de/low/master.m3u8'
  ] : [
    'https://daserste-live.ard-mcdn.de/daserste/live/hls/de/master.m3u8'
  ],

  zdf: isPS4 ? [
    // Для PS4 сначала high, не veryhigh
    'https://zdf-hls-15.akamaized.net/hls/live/2016498/de/high/master.m3u8',
    'https://zdf-hls-15.akamaized.net/hls/live/2016498/de/med/master.m3u8',
    'https://zdf-hls-15.akamaized.net/hls/live/2016498/de/low/master.m3u8',

    // Старые ZDF CDN варианты как запасной вариант
    'https://zdf-hls-01.akamaized.net/hls/live/2002460/de/high/master.m3u8',
    'https://zdf-hls-01.akamaized.net/hls/live/2002460/de/med/master.m3u8',
    'https://zdf-hls-01.akamaized.net/hls/live/2002460/de/low/master.m3u8'
  ] : [
    'https://zdf-hls-15.akamaized.net/hls/live/2016498/de/veryhigh/master.m3u8'
  ]
};

const streamIndex = { ard: 0, zdf: 0 };
const STREAMS = {
  ard: STREAM_CANDIDATES.ard[0],
  zdf: STREAM_CANDIDATES.zdf[0]
};

// Ссылки в блоке "Плейлист" обновляем под текущий поток
function updateOpenLinks() {
  ['ard','zdf'].forEach(ch => {
    const a = document.getElementById('open-' + ch);
    if (a) a.href = STREAM_CANDIDATES[ch][streamIndex[ch]];
  });
}
updateOpenLinks();

if (isPS4) {
  document.getElementById('ps4-banner-ard').style.display = 'block';
  document.getElementById('ps4-banner-zdf').style.display = 'block';
}

const hlsMap = {};
const state = { ard: 'idle', zdf: 'idle' };
const watchdog = { ard: null, zdf: null };
const lastTime = { ard: 0, zdf: 0 };
const stuckCount = { ard: 0, zdf: 0 };

function currentUrl(ch) {
  return STREAM_CANDIDATES[ch][streamIndex[ch]];
}

// На PS4 лучше держать только один активный video.
// Два HLS одновременно быстро забивают старый браузер и начинается "картинка стоит".
function stopOtherOnPS4(ch) {
  if (!isPS4) return;
  const other = ch === 'ard' ? 'zdf' : 'ard';
  const v = document.getElementById('vid-' + other);
  if (!v) return;
  try {
    v.pause();
    v.removeAttribute('src');
    v.load();
    state[other] = 'idle';
    document.getElementById('overlay-' + other).classList.remove('hidden');
    document.getElementById('card-' + other).classList.remove('active');
    stopWatchdog(other);
    updatePlayBtn(other);
  } catch(e) {}
}

function startStream(ch, forceUrl) {
  const vid = document.getElementById('vid-' + ch);
  const overlay = document.getElementById('overlay-' + ch);
  const loader = document.getElementById('loader-' + ch);
  const card = document.getElementById('card-' + ch);

  stopOtherOnPS4(ch);

  overlay.classList.add('hidden');
  loader.classList.add('show');
  card.classList.add('active');

  vid.muted = false;
  vid.defaultMuted = false;
  vid.volume = parseFloat(document.getElementById('vol-' + ch).value) || 1;
  vid.preload = isPS4 ? 'none' : 'auto';

  if (isPS4) {
    vid.controls = true;
    vid.setAttribute('controls', 'controls');
    vid.removeAttribute('playsinline');
    vid.removeAttribute('webkit-playsinline');
  }

  const url = forceUrl || currentUrl(ch);

  // ── iOS Safari: нативный HLS ───────────────────────────────────────────
  if (isIOS) {
    nativePlay(ch, url);
    return;
  }

  // ── PS4 и браузеры с нативным HLS / без MSE ───────────────────────────
  if (isPS4 || !window.Hls || !Hls.isSupported()) {
    nativePlay(ch, url);
    return;
  }

  // ── HLS.js для нормальных браузеров ───────────────────────────────────
  if (hlsMap[ch]) hlsMap[ch].destroy();

  hlsMap[ch] = new Hls({
    enableWorker: true,
    lowLatencyMode: false,
    maxBufferLength: 30,
    maxMaxBufferLength: 60,
    liveSyncDurationCount: 4,
    startLevel: -1
  });

  hlsMap[ch].loadSource(url);
  hlsMap[ch].attachMedia(vid);

  hlsMap[ch].on(Hls.Events.MANIFEST_PARSED, () => {
    playAfterLoad(ch);
  });

  hlsMap[ch].on(Hls.Events.ERROR, (e, data) => {
    if (data.fatal) {
      if (isPS4) tryNextStream(ch, 'fatal hls.js error');
      else showError(ch, '⚠ Fehler — erneut versuchen');
    }
  });
}

function nativePlay(ch, url) {
  const vid = document.getElementById('vid-' + ch);

  if (hlsMap[ch]) {
    hlsMap[ch].destroy();
    hlsMap[ch] = null;
  }

  try {
    vid.pause();
    vid.removeAttribute('src');
    vid.load();
  } catch(e) {}

  setTimeout(() => {
    vid.src = url;
    updateOpenLinks();
    vid.load();
    playAfterLoad(ch);
  }, isPS4 ? 250 : 0);
}

function playAfterLoad(ch) {
  const vid = document.getElementById('vid-' + ch);
  const loader = document.getElementById('loader-' + ch);
  const overlay = document.getElementById('overlay-' + ch);
  const card = document.getElementById('card-' + ch);

  vid.muted = false;
  vid.defaultMuted = false;
  vid.volume = parseFloat(document.getElementById('vol-' + ch).value) || 1;

  const p = vid.play();

  if (p && p.then) {
    p.then(() => {
      loader.classList.remove('show');
      state[ch] = 'playing';
      updatePlayBtn(ch);
      startWatchdog(ch);
    }).catch(() => {
      if (isPS4) {
        setTimeout(() => {
          vid.play().then(() => {
            loader.classList.remove('show');
            state[ch] = 'playing';
            updatePlayBtn(ch);
            startWatchdog(ch);
          }).catch(() => {
            loader.classList.remove('show');
            overlay.classList.remove('hidden');
            overlay.querySelector('.overlay-label').textContent = '▶ Play nochmal drücken';
            card.classList.remove('active');
          });
        }, 700);
      } else {
        vid.muted = true;
        vid.play().catch(() => {});
        highlightMuteBtn(ch);
        loader.classList.remove('show');
        state[ch] = 'playing';
        updatePlayBtn(ch);
      }
    });
  } else {
    loader.classList.remove('show');
    state[ch] = 'playing';
    updatePlayBtn(ch);
    startWatchdog(ch);
  }
}

function showError(ch, msg) {
  const loader = document.getElementById('loader-' + ch);
  const overlay = document.getElementById('overlay-' + ch);
  const card = document.getElementById('card-' + ch);
  loader.classList.remove('show');
  overlay.classList.remove('hidden');
  overlay.querySelector('.overlay-label').textContent = msg;
  card.classList.remove('active');
  state[ch] = 'idle';
  stopWatchdog(ch);
}

// PS4 watchdog: если currentTime не двигается, перезагружаем или меняем URL.
// Это лечит зависание через 1–2 минуты, если CDN/variant не дружит с PS4.
function startWatchdog(ch) {
  if (!isPS4) return;
  stopWatchdog(ch);

  const vid = document.getElementById('vid-' + ch);
  lastTime[ch] = vid.currentTime || 0;
  stuckCount[ch] = 0;

  watchdog[ch] = setInterval(() => {
    if (state[ch] !== 'playing' || vid.paused) return;

    const t = vid.currentTime || 0;
    const advanced = t > lastTime[ch] + 0.2;
    lastTime[ch] = t;

    if (advanced) {
      stuckCount[ch] = 0;
      return;
    }

    stuckCount[ch]++;

    // 3 проверки по 8 секунд = примерно 24 сек без движения
    if (stuckCount[ch] >= 3) {
      tryNextStream(ch, 'stalled watchdog');
    }
  }, 8000);
}

function stopWatchdog(ch) {
  if (watchdog[ch]) {
    clearInterval(watchdog[ch]);
    watchdog[ch] = null;
  }
}

function tryNextStream(ch, reason) {
  stopWatchdog(ch);

  const list = STREAM_CANDIDATES[ch];
  streamIndex[ch] = (streamIndex[ch] + 1) % list.length;

  const overlay = document.getElementById('overlay-' + ch);
  const loader = document.getElementById('loader-' + ch);
  const card = document.getElementById('card-' + ch);

  overlay.classList.add('hidden');
  loader.classList.add('show');
  card.classList.add('active');

  console.log('[PS4 fallback]', ch, reason, '->', list[streamIndex[ch]]);
  startStream(ch, list[streamIndex[ch]]);
}

// PS4: при нативных stalled/error событиях тоже меняем поток
['ard','zdf'].forEach(ch => {
  const vid = document.getElementById('vid-' + ch);

  vid.addEventListener('play',  () => { state[ch] = 'playing'; updatePlayBtn(ch); });
  vid.addEventListener('pause', () => { if (state[ch] !== 'idle') state[ch] = 'paused'; updatePlayBtn(ch); });

  vid.addEventListener('stalled', () => {
    if (isPS4 && state[ch] === 'playing') setTimeout(() => tryNextStream(ch, 'native stalled'), 2000);
  });

  vid.addEventListener('error', () => {
    if (isPS4) setTimeout(() => tryNextStream(ch, 'native error'), 500);
  });

  vid.addEventListener('volumechange', () => updateMuteIcon(ch));
});

function highlightMuteBtn(ch) {
  const btn = document.getElementById('mute-' + ch);
  btn.style.color = '#f59e0b';
  btn.style.borderColor = '#f59e0b';
  btn.title = '⚠ Нажми — включить звук';
}

function togglePlay(ch) {
  const vid = document.getElementById('vid-' + ch);
  if (state[ch] === 'idle') { startStream(ch); return; }
  if (vid.paused) { vid.play(); state[ch] = 'playing'; startWatchdog(ch); }
  else { vid.pause(); state[ch] = 'paused'; stopWatchdog(ch); }
  updatePlayBtn(ch);
}

function updatePlayBtn(ch) {
  const btn = document.getElementById('playpause-' + ch);
  const vid = document.getElementById('vid-' + ch);
  const playing = state[ch] === 'playing' && !vid.paused;
  btn.innerHTML = playing
    ? '<svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>'
    : '<svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor"><path d="M8 5v14l11-7z"/></svg>';
}

const ICON_SOUND = '<svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>';
const ICON_MUTE  = '<svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-3-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06A9 9 0 0 0 17.73 19L19 20.27 20.27 19 5.27 4 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>';

function toggleMute(ch) {
  const vid = document.getElementById('vid-' + ch);
  vid.muted = !vid.muted;
  if (!vid.muted && vid.volume === 0) vid.volume = 1;
  updateMuteIcon(ch);
}

function updateMuteIcon(ch) {
  const vid = document.getElementById('vid-' + ch);
  const btn = document.getElementById('mute-' + ch);
  btn.innerHTML = (vid.muted || vid.volume === 0) ? ICON_MUTE : ICON_SOUND;
  btn.style.color = '';
  btn.style.borderColor = '';
  btn.title = (vid.muted || vid.volume === 0) ? 'Stumm' : 'Ton an/aus';
}

function setVolume(ch, val) {
  const vid = document.getElementById('vid-' + ch);
  vid.volume = parseFloat(val);
  if (vid.volume > 0) vid.muted = false;
  updateMuteIcon(ch);
}

function goFullscreen(ch) {
  const vid = document.getElementById('vid-' + ch);
  const wrap = document.getElementById('wrap-' + ch);

  if (isIOS || isPS4) {
    if (vid.webkitEnterFullscreen) { vid.webkitEnterFullscreen(); return; }
  }

  if      (wrap.requestFullscreen)       wrap.requestFullscreen();
  else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
  else if (wrap.mozRequestFullScreen)    wrap.mozRequestFullScreen();
  else if (vid.webkitEnterFullscreen)    vid.webkitEnterFullscreen();
}

// На PS4 "Alle starten" опасно — стартуем только ARD, иначе два HLS убивают браузер.
function startAll() {
  if (isPS4) {
    startStream('ard');
    return;
  }
  startStream('ard');
  setTimeout(() => startStream('zdf'), 800);
}

function copyUrl(ch) {
  const url = currentUrl(ch);
  const btn = document.getElementById('copy-' + ch);
  const orig = btn.innerHTML;
  const ok = '<svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg> Скопировано!';
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => { btn.innerHTML = ok; setTimeout(() => btn.innerHTML = orig, 2000); }).catch(() => prompt('Скопируй:', url));
  } else {
    prompt('Скопируй:', url);
  }
}

document.addEventListener('keydown', e => {
  if (e.key === ' ' && e.target === document.body) {
    e.preventDefault();
    const active = document.querySelector('.channel-card.active');
    if (active) togglePlay(active.id.replace('card-', ''));
  }
});

// Clock
function tick() {
  const now = new Date(), pad = n => String(n).padStart(2,'0');
  const days = ['So','Mo','Di','Mi','Do','Fr','Sa'];
  document.getElementById('live-clock').textContent =
    `${days[now.getDay()]} ${pad(now.getDate())}.${pad(now.getMonth()+1)} · ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
}
tick(); setInterval(tick, 1000);
</script>
